name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - run: pip install torch==2.4.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "git+https://github.com/la2pixel/depRL.git@485fc9375ad76cfc2969a081b88ae951fe0d821e" -e ".[dev]"
      - run: pytest
