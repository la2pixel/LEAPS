<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <style>
      text { font-family: 'Helvetica Neue', Arial, sans-serif; }
      .t  { font-weight: 700; }
      .m  { font-family: 'SF Mono', Menlo, Consolas, monospace; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6472"/></marker>
    <marker id="ac" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e0714f"/></marker>
    <marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa7bd"/></marker>
    <filter id="sh" x="-8%" y="-8%" width="116%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1b2233" flood-opacity="0.10"/></filter>
  </defs>

  <rect width="1200" height="700" fill="#ffffff"/>

  <text class="t" x="40" y="40" font-size="22" fill="#1b2233">Standard locomotion-RL architecture &#8212; and where the coordination prior enters</text>
  <text x="40" y="62" font-size="13" fill="#5a6472">Same actor&#8211;critic loop in DEP-RL, Lattice, LAP, Park et al., SAR. Only the prior source differs: a loop back from the body, or an external measurement.</text>
  <line x1="40" y1="76" x2="1160" y2="76" stroke="#e2e6ec"/>

  <!-- ENVIRONMENT -->
  <rect x="360" y="96" width="560" height="60" rx="12" fill="#eef6f0" stroke="#a7c7b4" stroke-width="1.4" filter="url(#sh)"/>
  <text class="t" x="640" y="121" font-size="14" fill="#2b3444" text-anchor="middle">ENVIRONMENT &#8212; simulated body</text>
  <text x="640" y="139" font-size="11.5" fill="#5a6472" text-anchor="middle">physics sim  &#183;  musculoskeletal / torque model</text>

  <!-- OBSERVATION -->
  <rect x="60" y="208" width="210" height="104" rx="12" fill="#f4f6fa" stroke="#c7cfdd" filter="url(#sh)"/>
  <text class="t" x="165" y="232" font-size="13.5" fill="#2b3444" text-anchor="middle">OBSERVATION</text>
  <text x="165" y="254" font-size="11" fill="#37414f" text-anchor="middle">body pose + velocity</text>
  <text x="165" y="272" font-size="11" fill="#37414f" text-anchor="middle">joint q, q&#775;</text>
  <text x="165" y="290" font-size="11" fill="#37414f" text-anchor="middle">previous action</text>

  <!-- POLICY / ACTOR -->
  <rect x="330" y="200" width="220" height="126" rx="12" fill="#eef2fb" stroke="#9db0d6" stroke-width="1.4" filter="url(#sh)"/>
  <text class="t" x="440" y="224" font-size="13.5" fill="#2b3444" text-anchor="middle">POLICY  &#960;&#952;   (actor)</text>
  <text x="440" y="244" font-size="11" fill="#37414f" text-anchor="middle">MLP  2 &#215; 256</text>
  <text x="440" y="262" font-size="11" fill="#37414f" text-anchor="middle">outputs  z ,  a_res</text>
  <text x="440" y="286" font-size="11" fill="#5a6472" text-anchor="middle" font-style="italic">&#8220;some algorithm&#8221;</text>
  <text x="440" y="304" font-size="10.5" fill="#5a6472" text-anchor="middle">PPO / SAC / TD3 / MPO</text>

  <!-- ACTION COMPOSER -->
  <rect x="610" y="190" width="300" height="150" rx="12" fill="#f4f6fa" stroke="#c7cfdd" stroke-width="1.4" filter="url(#sh)"/>
  <text class="t" x="760" y="214" font-size="13.5" fill="#2b3444" text-anchor="middle">ACTION COMPOSER</text>
  <text class="m" x="628" y="242" font-size="11.5" fill="#2b3444">(1&#8722;w)&#183;&#226; + w&#183;a_res</text>
  <text x="892" y="242" font-size="10" fill="#5a6472" text-anchor="end">soft blend &#8212; LAP, SAR</text>
  <text class="m" x="628" y="266" font-size="11.5" fill="#2b3444">W &#183; c</text>
  <text x="892" y="266" font-size="10" fill="#5a6472" text-anchor="end">hard constraint &#8212; Park et al.</text>
  <text class="m" x="628" y="290" font-size="11.5" fill="#2b3444">a&#960; + structured noise</text>
  <text x="892" y="290" font-size="10" fill="#5a6472" text-anchor="end">exploration &#8212; DEP-RL, Lattice</text>
  <line x1="628" y1="304" x2="892" y2="304" stroke="#dfe4ec"/>
  <text x="760" y="324" font-size="10.5" fill="#5a6472" text-anchor="middle">&#8594; action a&#8348; , normalised [&#8722;1, 1]  &#8594;  excitation / torque</text>

  <!-- ACTION PRIOR (accent) -->
  <rect x="970" y="200" width="180" height="126" rx="12" fill="#ffe9e3" stroke="#e0714f" stroke-width="2" filter="url(#sh)"/>
  <text class="t" x="1060" y="224" font-size="13.5" fill="#a83f22" text-anchor="middle">ACTION PRIOR</text>
  <text x="1060" y="243" font-size="11" fill="#a83f22" text-anchor="middle">frozen</text>
  <text x="1060" y="266" font-size="11" fill="#7d4634" text-anchor="middle">decoder  g&#966;(z)</text>
  <text x="1060" y="284" font-size="11" fill="#7d4634" text-anchor="middle">or synergy basis W</text>
  <text x="1060" y="307" font-size="11" fill="#7d4634" text-anchor="middle">&#8594;  &#226;</text>

  <!-- CRITIC -->
  <rect x="330" y="378" width="200" height="96" rx="12" fill="#eef2fb" stroke="#9db0d6" stroke-width="1.4" filter="url(#sh)"/>
  <text class="t" x="430" y="404" font-size="13.5" fill="#2b3444" text-anchor="middle">CRITIC  Q&#966;</text>
  <text x="430" y="424" font-size="11" fill="#37414f" text-anchor="middle">value estimate</text>
  <text x="430" y="443" font-size="10" fill="#5a6472" text-anchor="middle">off-policy: MPO / SAC / TD3</text>

  <!-- LEARNER -->
  <rect x="580" y="378" width="260" height="96" rx="12" fill="#f4f6fa" stroke="#c7cfdd" stroke-width="1.4" filter="url(#sh)"/>
  <text class="t" x="710" y="404" font-size="13.5" fill="#2b3444" text-anchor="middle">RL LEARNER</text>
  <text x="710" y="424" font-size="11" fill="#37414f" text-anchor="middle">replay buffer  &#183;  gradient update</text>
  <text x="710" y="443" font-size="10" fill="#5a6472" text-anchor="middle">updates &#952;, &#966;</text>

  <!-- ===== arrows (RL loop) ===== -->
  <!-- env -> observation -->
  <polyline points="400,156 400,182 165,182 165,208" fill="none" stroke="#5a6472" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="258" y="176" font-size="10.5" fill="#5a6472" font-style="italic" text-anchor="middle">state s&#8348;  &#183;  reward r&#8348;  &#183;  done</text>
  <!-- obs -> policy -->
  <line x1="270" y1="260" x2="330" y2="260" stroke="#5a6472" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="300" y="252" font-size="10.5" fill="#5a6472" font-style="italic" text-anchor="middle">o&#8348;</text>
  <!-- policy -> composer -->
  <line x1="550" y1="248" x2="610" y2="248" stroke="#5a6472" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="580" y="240" font-size="10" fill="#5a6472" font-style="italic" text-anchor="middle">z, a_res</text>
  <!-- action prior -> composer -->
  <line x1="968" y1="256" x2="912" y2="256" stroke="#e0714f" stroke-width="1.6" marker-end="url(#ac)"/>
  <text x="940" y="248" font-size="10" fill="#a83f22" font-style="italic" text-anchor="middle">&#226;</text>
  <!-- composer -> env -->
  <polyline points="840,190 840,164" fill="none" stroke="#5a6472" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="852" y="180" font-size="10" fill="#5a6472" font-style="italic">action a&#8348;</text>
  <!-- policy -> critic -->
  <line x1="430" y1="326" x2="430" y2="378" stroke="#5a6472" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="438" y="356" font-size="10" fill="#5a6472" font-style="italic">a</text>
  <!-- critic -> learner -->
  <line x1="530" y1="426" x2="580" y2="426" stroke="#5a6472" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- learner -> policy (theta update) -->
  <polyline points="700,378 700,344 472,344 472,326" fill="none" stroke="#5a6472" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="600" y="338" font-size="10" fill="#5a6472" font-style="italic" text-anchor="middle">&#952; update</text>
  <!-- env experience -> learner -->
  <polyline points="905,156 958,156 958,426 840,426" fill="none" stroke="#9aa7bd" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#am)"/>
  <text x="964" y="300" font-size="9.5" fill="#9aa7bd" font-style="italic">transitions</text>

  <!-- ===== PRIOR SOURCE band ===== -->
  <line x1="40" y1="512" x2="1160" y2="512" stroke="#d7dde7"/>
  <text class="t" x="40" y="506" font-size="12.5" letter-spacing="1.2" fill="#7a8494">PRIOR SOURCE  &#183;  built once, then frozen</text>

  <!-- row A: prior work -->
  <text class="t" x="40" y="552" font-size="12" fill="#3a4658">Prior work</text>
  <text x="132" y="552" font-size="11.5" fill="#3a4658">expert-demo trajectory   &#183;   trained-policy rollout   &#183;   inverse-sim activations   &#183;   self-play rollouts</text>
  <text x="132" y="570" font-size="10.5" fill="#8a94a6" font-style="italic">all sampled from the same simulated body &#8212; the prior cannot exceed a controller you already have</text>
  <!-- loop back from ENV to row A -->
  <polyline points="922,150 1176,150 1176,548 1006,548" fill="none" stroke="#9aa7bd" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#am)"/>
  <text x="1176" y="142" font-size="9.5" fill="#9aa7bd" font-style="italic" text-anchor="end">prior work closes this loop</text>
  <!-- row A -> ACTION PRIOR -->
  <polyline points="1060,536 1060,328" fill="none" stroke="#9aa7bd" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#am)"/>

  <!-- row B: LEAPS -->
  <text class="t" x="40" y="624" font-size="12" fill="#a83f22">LEAPS</text>
  <rect x="132" y="604" width="92" height="40" rx="8" fill="#ffffff" stroke="#e0714f" stroke-width="1.5"/>
  <text x="178" y="620" font-size="10" fill="#7d4634" text-anchor="middle">walking</text>
  <text x="178" y="633" font-size="10" fill="#7d4634" text-anchor="middle">human</text>
  <line x1="224" y1="624" x2="256" y2="624" stroke="#e0714f" stroke-width="1.6" marker-end="url(#ac)"/>
  <rect x="256" y="604" width="150" height="40" rx="8" fill="#ffffff" stroke="#e0714f" stroke-width="1.5"/>
  <text x="331" y="620" font-size="11" fill="#7d4634" text-anchor="middle">EMG dataset</text>
  <text x="331" y="634" font-size="9" fill="#9a7060" text-anchor="middle">Camargo &#183; 11 channels</text>
  <line x1="406" y1="624" x2="438" y2="624" stroke="#e0714f" stroke-width="1.6" marker-end="url(#ac)"/>
  <rect x="438" y="604" width="150" height="40" rx="8" fill="#ffffff" stroke="#e0714f" stroke-width="1.5"/>
  <text x="513" y="620" font-size="11" fill="#7d4634" text-anchor="middle">autoencoder</text>
  <text x="513" y="634" font-size="9" fill="#9a7060" text-anchor="middle">train &#8594; freeze g&#966;</text>
  <!-- row B -> ACTION PRIOR -->
  <polyline points="588,624 1000,624 1000,328" fill="none" stroke="#e0714f" stroke-width="1.7" marker-end="url(#ac)"/>
  <text x="770" y="616" font-size="10.5" fill="#a83f22" font-style="italic" text-anchor="middle">measured  &#183;  external  &#183;  no controller needed</text>
</svg>
