wandb:
  project: leaps-ppo
lr: 0.0003
experiment:
  task_factory:
    name: RLFactory
    params: {}
  env_params:
    env_name: Gait10dof18Musc
    horizon: 1000
    terminal_state_type: HeightJointTerminalStateHandler
    goal_type: NoGoal
    headless: true
    reward_type: WalkingReward
    reward_params:
      target_velocity: 1.25
      alive_bonus: 1.0
      posture_weight: 1.0
  hidden_layers:
  - 512
  - 256
  lr: 0.0003
  num_envs: 2048
  num_steps: 50
  total_timesteps: 50000000.0
  update_epochs: 4
  num_minibatches: 32
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  init_std: 0.8
  learnable_std: true
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  activation: tanh
  anneal_lr: true
  weight_decay: 0.0
  normalize_env: true
  debug: false
  n_seeds: 1
  vmap_across_seeds: false
  validation:
    active: false
    num_steps: 500
    num_envs: 10
    num: 5
