[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leaps"
version = "0.1.0"
description = "Learning Humanoid Locomotion from EMG-Based Latent Action Priors and Muscle Synergies"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Lalitha Sivakumar", email = "lalitha.sivakumar@is.mpg.de"}
]
keywords = ["reinforcement learning", "biomechanics", "EMG", "muscle synergies", "humanoid control", "locomotion"]

dependencies = [
    "numpy>=1.24,<2",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "torch>=2.0",
    "pandas>=2.0",
    "h5py>=3.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
wandb = ["wandb>=0.15"]

[project.scripts]
leaps = "leaps.cli:main"

[project.urls]
Homepage = "https://github.com/la2pixel/LEAPS"
Repository = "https://github.com/la2pixel/LEAPS"

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
